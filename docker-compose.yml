services:
  user-patient-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/user-patient-service:/app
    env_file:
      - ./backend/user-patient-service/.env
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
      - mongo
    networks:
      - nexuscare

  doctor-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/doctor-service:/app
    env_file:
      - ./backend/doctor-service/.env
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - video-session-integration-service
      - rabbitmq
      - mongo
    networks:
      - nexuscare

  appointment-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/appointment-service:/app
    env_file:
      - ./backend/appointment-service/.env
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - doctor-service
      - rabbitmq
      - mongo
    networks:
      - nexuscare

  ai-symptom-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/ai-symptom-service:/app
    env_file:
      - ./backend/ai-symptom-service/.env
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    networks:
      - nexuscare

  video-session-integration-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/video-session-integration-service:/app
    env_file:
      - ./backend/video-session-integration-service/.env
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
      - mongo
    networks:
      - nexuscare

  notification-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/notification-service:/app
    env_file:
      - ./backend/notification-service/.env
    command: sh -c "npm install && npm start"
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
      - mongo
    networks:
      - nexuscare

  fee-management-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/fee-management-service:/app
    env_file:
      - ./backend/fee-management-service/.env
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    depends_on:
      - mongo
    networks:
      - nexuscare

  payment-service:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/payment-service:/app
    env_file:
      - ./backend/payment-service/.env
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    depends_on:
      - mongo
    networks:
      - nexuscare

  api-gateway:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend/api-gateway:/app
    env_file:
      - ./backend/api-gateway/.env
    ports:
      - '8080:8080'
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - USER_SERVICE_URL=http://user-patient-service:5001
      - DOCTOR_SERVICE_URL=http://doctor-service:5002
      - APPOINTMENT_SERVICE_URL=http://appointment-service:5003
      - AI_SERVICE_URL=http://ai-symptom-service:5004
      - VIDEO_SERVICE_URL=http://video-session-integration-service:5005
      - NOTIFICATION_SERVICE_URL=http://notification-service:5006
      - FEE_SERVICE_URL=http://fee-management-service:5007
      - PAYMENT_SERVICE_URL=http://payment-service:5009
      - ALLOWED_ORIGINS=http://localhost:9000
    depends_on:
      - user-patient-service
      - doctor-service
      - appointment-service
      - ai-symptom-service
      - video-session-integration-service
      - notification-service
      - fee-management-service
      - payment-service
    networks:
      - nexuscare

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - nexuscare

  mongo:
    image: mongo:6.0.12
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=nexuscare
    volumes:
      - mongo-data:/data/db
    networks:
      - nexuscare

volumes:
  mongo-data:

networks:
  nexuscare:
    driver: bridge
