apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexuscare-api-gateway
  namespace: nexuscare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nexuscare/api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nexuscare-config
            - secretRef:
                name: nexuscare-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nexuscare
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
