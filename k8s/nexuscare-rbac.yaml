apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexuscare-sa
  namespace: nexuscare
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexuscare-role
rules:
  # Allow reading ConfigMaps and Secrets within the namespace
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Allow reading services for service discovery
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Allow writing logs
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexuscare-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nexuscare-role
subjects:
  - kind: ServiceAccount
    name: nexuscare-sa
    namespace: nexuscare
